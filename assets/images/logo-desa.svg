<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15284F"/>
      <stop offset="100%" stop-color="#0D1B36"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Outer Pentagon Shield with Navy Theme -->
  <path d="M 250,20 L 440,80 L 400,380 L 250,470 L 100,380 L 60,80 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Inner Border Shield -->
  <path d="M 250,38 L 420,92 L 385,365 L 250,448 L 115,365 L 80,92 Z" fill="none" stroke="#22C55E" stroke-width="3"/>

  <!-- Scenery Circle -->
  <g transform="translate(100, 100)">
    <clipPath id="circleClip">
      <circle cx="150" cy="140" r="130"/>
    </clipPath>
    <circle cx="150" cy="140" r="130" fill="url(#skyGrad)"/>
    
    <!-- Sun -->
    <circle cx="150" cy="90" r="28" fill="#FDE047" clip-path="url(#circleClip)"/>

    <!-- Mountain Galunggung -->
    <polygon points="150,50 30,220 270,220" fill="url(#mountainGrad)" clip-path="url(#circleClip)"/>
    <polygon points="210,80 120,220 300,220" fill="#166534" clip-path="url(#circleClip)"/>

    <!-- Terraced Rice Fields -->
    <path d="M 30,170 Q 150,190 270,170 L 270,270 L 30,270 Z" fill="#86EFAC" clip-path="url(#circleClip)"/>
    <path d="M 30,195 Q 150,215 270,195 L 270,270 L 30,270 Z" fill="#4ADE80" clip-path="url(#circleClip)"/>
    <path d="M 30,220 Q 150,240 270,220 L 270,270 L 30,270 Z" fill="#15803D" clip-path="url(#circleClip)"/>

    <!-- Flowing River -->
    <path d="M 150,170 Q 130,200 160,230 Q 140,250 150,270 L 175,270 Q 165,250 185,230 Q 155,200 170,170 Z" fill="url(#riverGrad)" clip-path="url(#circleClip)"/>
  </g>

  <!-- Rice Wreath Left & Right (Gold) -->
  <path d="M 85,280 C 85,380 200,430 250,435 C 300,430 415,380 415,280" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Top Ribbon Banner -->
  <rect x="105" y="55" width="290" height="34" rx="17" fill="#0D1B36" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <text x="250" y="78" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">DESA SUKAGALIH</text>

  <!-- Bottom Sub-Banner -->
  <rect x="125" y="405" width="250" height="26" rx="13" fill="#15284F" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="250" y="423" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#EAB308" text-anchor="middle" letter-spacing="1.2">KEC. SUKARATU • TASIKMALAYA</text>
</svg>
