<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Outer Text Path Top -->
    <path id="textPathTop" d="M 90,300 A 210,210 0 1,1 510,300" fill="none"/>
    <!-- Outer Text Path Bottom -->
    <path id="textPathBottom" d="M 510,300 A 210,210 0 0,1 90,300" fill="none"/>

    <linearGradient id="skyBth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="mountBth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="riverBth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="skin1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <!-- Outer Dark Navy Ring -->
  <circle cx="300" cy="300" r="260" fill="#15284F" stroke="#E2E8F0" stroke-width="4"/>
  <circle cx="300" cy="300" r="200" fill="#FFFFFF" stroke="#15284F" stroke-width="6"/>

  <!-- Left & Right Circular Accents on Ring -->
  <circle cx="75" cy="300" r="16" fill="#EDE9DF"/>
  <circle cx="525" cy="300" r="16" fill="#EDE9DF"/>

  <!-- Text Top Curved -->
  <text font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="29" fill="#FFFFFF" letter-spacing="3">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      KELOMPOK 09 DESA SUKAGALIH
    </textPath>
  </text>

  <!-- Text Bottom Curved -->
  <text font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      KKN 2026 UNIVERSITAS BTH
    </textPath>
  </text>

  <!-- Inner Illustration Area -->
  <g id="sceneryGroup">
    <clipPath id="innerCircleClip">
      <circle cx="300" cy="300" r="190"/>
    </clipPath>

    <!-- Sky -->
    <circle cx="300" cy="300" r="190" fill="url(#skyBth)"/>

    <!-- Birds -->
    <path d="M 330,190 Q 338,183 346,190 Q 354,183 362,190" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M 345,205 Q 351,200 357,205 Q 363,200 369,205" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Green Mount Galunggung -->
    <polygon points="300,160 170,360 430,360" fill="url(#mountBth)" clip-path="url(#innerCircleClip)"/>
    <polygon points="300,160 300,360 430,360" fill="#14532D" clip-path="url(#innerCircleClip)" opacity="0.3"/>

    <!-- Left & Right Hills -->
    <polygon points="210,240 120,380 300,380" fill="#22C55E" clip-path="url(#innerCircleClip)"/>
    <polygon points="390,240 300,380 480,380" fill="#16A34A" clip-path="url(#innerCircleClip)"/>

    <!-- Terraced Rice Field Lines -->
    <path d="M 120,320 Q 200,300 270,360 L 270,440 L 120,440 Z" fill="#86EFAC" clip-path="url(#innerCircleClip)"/>
    <path d="M 120,350 Q 200,330 270,390 L 270,440 L 120,440 Z" fill="#4ADE80" clip-path="url(#innerCircleClip)"/>
    <path d="M 120,380 Q 200,360 270,420 L 270,440 L 120,440 Z" fill="#22C55E" clip-path="url(#innerCircleClip)"/>

    <!-- Flowing Stream -->
    <path d="M 300,310 Q 260,350 290,400 Q 260,450 280,500 L 320,500 Q 300,450 330,400 Q 300,350 320,310 Z" fill="url(#riverBth)" clip-path="url(#innerCircleClip)"/>

    <!-- Palm Trees & Village Houses Silhouette -->
    <g transform="translate(340, 275) scale(0.6)" fill="#854D0E">
      <rect x="0" y="20" width="30" height="20" fill="#92400E"/>
      <polygon points="15,0 -5,22 35,22" fill="#78350F"/>
      <rect x="35" y="15" width="25" height="25" fill="#B45309"/>
      <polygon points="47,-3 30,17 65,17" fill="#78350F"/>
    </g>

    <!-- Golden Rice Stalks on Sides -->
    <!-- Left Stalk -->
    <path d="M 170,340 C 150,280 170,220 200,180" fill="none" stroke="#84CC16" stroke-width="4" clip-path="url(#innerCircleClip)"/>
    <!-- Right Stalk (Gold) -->
    <path d="M 430,340 C 450,280 430,220 400,180" fill="none" stroke="#EAB308" stroke-width="5" clip-path="url(#innerCircleClip)"/>
    <circle cx="410" cy="200" r="5" fill="#EAB308"/>
    <circle cx="420" cy="220" r="5" fill="#EAB308"/>
    <circle cx="425" cy="240" r="5" fill="#EAB308"/>
    <circle cx="430" cy="265" r="5" fill="#EAB308"/>

    <!-- Green Circular Hugging Base -->
    <path d="M 110,340 C 110,450 490,450 490,340 C 450,470 150,470 110,340 Z" fill="#15803D" stroke="#22C55E" stroke-width="4"/>

    <!-- Handshake Element (Symbiosis & KKN Partnership) -->
    <g transform="translate(300, 395)">
      <!-- Handshake Shield Background -->
      <ellipse cx="0" cy="0" rx="90" ry="50" fill="#FFFFFF" stroke="#15803D" stroke-width="4"/>
      
      <!-- Handshake Graphic -->
      <!-- Left Arm & Hand -->
      <path d="M -70,-20 L -30,-5 L -10,-10 L 0,-5 L -5,18 L -30,20 L -70,5 Z" fill="url(#skin2)" stroke="#78350F" stroke-width="2"/>
      
      <!-- Right Arm & Hand -->
      <path d="M 70,-20 L 30,-5 L 10,-10 L 0,-5 L 5,18 L 30,20 L 70,5 Z" fill="url(#skin1)" stroke="#D97706" stroke-width="2"/>

      <!-- Clasping Fingers -->
      <path d="M -15,-5 C -15,10 5,15 15,10 C 20,5 15,-5 0,-5" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
      <path d="M -22,1 C -22,12 -2,16 6,12" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M -28,7 C -28,15 -10,18 -2,15" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
